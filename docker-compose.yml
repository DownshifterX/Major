version: "3.8"

services:
  # Nya AI Web & API Service
  nyaai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyaai_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/backend/data/nya.db
      - EMBEDDING_PROVIDER=sentence-transformers
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    volumes:
      # Persistent SQLite database and cache directory
      - ./backend/data:/app/backend/data

  # (Optional) Cloudflare Tunnel Service
  # Allows exposing your application directly to a Cloudflare domain with zero open ports!
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: nyaai_tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - nyaai
